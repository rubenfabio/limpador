# CI no GitHub — DESLIGADO por padrão (ADR-0017). O CI do projeto roda localmente:
# `pnpm ci` no hook pre-push e a mutação completa semanal numa tarefa agendada do Windows.
# Este workflow só roda quando disparado à mão (Actions → CI → Run workflow).
# Para religar em push/PR, volte a pôr `push`, `pull_request` e `schedule` em `on:`.
# Cada `run:` aqui tem equivalente local documentado no AGENTS.md.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificacoes:
    name: Verificações e testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Toolchain Rust fixada
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: tauri-driver (e2e do app real)
        run: cargo install tauri-driver --locked
      - name: cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Dependências JS
        run: pnpm install --frozen-lockfile
      - name: Navegador do e2e da interface
        run: pnpm --filter ui exec playwright install chromium
      - name: Formatação, lint e tipos
        run: pnpm check
      - name: Testes (unitários, integração, e2e e rastreabilidade)
        run: pnpm test
      - name: Mutação completa
        run: pnpm mutation:full
      - name: Relatórios (capturas de tela, logs, máquina falsa, mutação)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
