[workspace]
resolver = "3"
members = ["crates/core", "crates/testkit", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rubenfabio/limpador"

[workspace.lints.rust]
# Denied everywhere; only the Windows adapter of the core allows it (ADR-0022).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
