[package]
name = "limpador-app"
description = "App desktop do Limpador (casca Tauri em volta do núcleo)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "limpador-app"

[lib]
name = "limpador_app_lib"

[features]
# Accepts LIMPADOR_SANDBOX (fake machine) — only for e2e test builds, never for releases.
sandbox = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
limpador-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
# Only for `#[cfg_attr(test, mutants::skip)]`; never part of a release build.
mutants = "0.0.3"
tempfile = "3.27.0"

[lints]
workspace = true
